name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - name: Install and verify Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          metal_path="$(/usr/bin/xcrun --toolchain MetalToolchain --find metal)"
          if ! metallib_path="$(/usr/bin/xcrun --toolchain MetalToolchain --find metallib 2>/dev/null)"; then
            metallib_path="$(dirname "$metal_path")/metallib"
          fi
          test -x "$metal_path"
          test -x "$metallib_path"
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: swift test
      - name: Run release smoke benchmarks
        run: swift run -c release OpalCryptoBenchmarks -- --suite smoke

  stable-release-dependencies:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Reject unstable dependencies in tagged releases
        run: |
          if git grep -nE '(branch|revision):' -- Package.swift; then
            echo "Tagged releases must not depend on branches or revisions."
            exit 1
          fi
