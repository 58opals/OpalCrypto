name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Run release smoke benchmarks
        run: swift run -c release OpalCryptoBenchmarks -- --suite smoke

  stable-release-dependencies:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Reject unstable dependencies in tagged releases
        run: |
          if git grep -nE '(branch|revision):' -- Package.swift; then
            echo "Tagged releases must not depend on branches or revisions."
            exit 1
          fi
